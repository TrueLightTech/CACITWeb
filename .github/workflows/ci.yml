# Tests on pull requests.
#
# This used to trigger on main and master. The default branch is dev and always
# has been, so neither name ever matched and the workflow had never run once.
name: CI

on:
  pull_request:
    branches:
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 20.x, matching package.json engines and the Dockerfile that actually
      # builds this in production. The old workflow pinned 14.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm test
